services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: crf
      POSTGRES_PASSWORD: crf
      POSTGRES_DB: crf
    ports:
      - "5433:5432"
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crf"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
